# 能力卡片库示例 —— 复制到 data/capability_cards.yaml 后按自己的简历填写。
#
# data/ 整个目录被 .gitignore 排除：真实卡片含雇主、项目代号、客户案例，
# 以及本人对每项能力的诚实自评，不应进版本库。
#
# 纪律（与 docs/superpowers/specs 的设计文档 §4.4 一致）：
#   1. 一张卡片 = 一个可被 JD 提问的能力点（一个项目可拆出多张）。
#   2.「证据强度」只能是 强 / 中 / 弱：
#      强 = 能讲 30 分钟 / 中 = 能讲 5 分钟 / 弱 = 仅接触。
#      这一列是本系统防止简历吹牛的唯一防线，必须逐张校对，宁可低估。
#   3.「可量化」只写口径明确的数字**名称**，不写数字本身。
#   4.「同义表述」是语义对齐的主力，宁可写多 —— JD 措辞和简历措辞很少一致。
#   5. 纯数字需加引号，否则 YAML 会解析成 int，加载时会报错。

- id: cap-example-rag
  能力: RAG 检索增强问答
  同义表述: [RAG, 检索增强, 知识库问答, 文档智能, 向量检索, 语义检索]
  证据强度: 强
  项目: 某企业级文档问答平台
  可量化: [准确率, 文档量]
  可讲深度: OCR 预处理→分块策略→召回调优→答案生成全链路，踩过的坑能展开讲
  关联简历版本: [后端AI版]

- id: cap-example-docker
  能力: Docker 容器化与部署
  同义表述: [Docker, 容器, 编排, CI/CD, 镜像]
  证据强度: 中
  项目: 某内部服务上线
  可量化: []
  可讲深度: 写过 Dockerfile 与 compose 编排，做过一次线上部署
  关联简历版本: [后端研发版]

- id: cap-example-k8s
  能力: Kubernetes 编排
  同义表述: [k8s, 容器编排, Helm]
  证据强度: 弱
  项目: 跟随文档跑通过 deployment
  可量化: []
  可讲深度: 仅接触，没有生产经验 —— 打分时最多算加分项，不能当主要依据
  关联简历版本: []
