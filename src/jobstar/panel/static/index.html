<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jobstar 面板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #4f6bed;
    --accent-soft: #eef1fd;
    --warn: #b3541e;
    --warn-soft: #fdf3ea;
    --danger: #b3323c;
    --danger-soft: #fdeff0;
    --ok: #1f7a4d;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --surface: #1b1e24;
      --surface-2: #21252c;
      --border: #2e333c;
      --text: #e6e8eb;
      --muted: #949ba7;
      --accent: #7f93f5;
      --accent-soft: #23293f;
      --warn: #e0a26a;
      --warn-soft: #2e2519;
      --danger: #ef8a92;
      --danger-soft: #321f22;
      --ok: #5cc48d;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .92em;
  }
  code {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 5px;
  }

  /* ---- 布局 ---- */
  .shell { display: grid; grid-template-columns: 196px 1fr; min-height: 100vh; }
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .brand {
    font-size: 16px; font-weight: 700; letter-spacing: .3px;
    padding: 0 10px 16px; display: flex; align-items: center; gap: 8px;
  }
  .brand small { font-weight: 400; color: var(--muted); font-size: 11px; }
  nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left;
    padding: 8px 10px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text);
    font: inherit; cursor: pointer;
  }
  nav button:hover { background: var(--surface-2); }
  nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .tally {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  nav button.on .tally { background: var(--accent); }
  .side-foot { margin-top: auto; padding: 12px 10px 0; color: var(--muted); font-size: 11px; }

  main { padding: 22px 26px 60px; max-width: 1040px; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .lede { color: var(--muted); margin: 0 0 18px; }
  h3 { margin: 26px 0 10px; font-size: 14px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .6px; }
  h3:first-child { margin-top: 0; }

  /* ---- 状态条 ---- */
  .bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 16px; margin-bottom: 16px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 22px; }
  .stat { display: flex; flex-direction: column; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 17px; font-weight: 650; }
  .stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .notes { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .note {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; padding: 7px 11px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
  }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--danger-soft); color: var(--danger); }

  /* ---- 卡片 ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; margin-bottom: 12px;
  }
  .card.flag { border-color: var(--danger); background: var(--danger-soft); }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .card-head .title { flex: 1; min-width: 0; }
  .card-head b { font-size: 15px; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .score {
    font-size: 24px; font-weight: 700; line-height: 1;
    padding: 6px 12px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
  }
  .jd {
    white-space: pre-wrap; max-height: 300px; overflow: auto;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px;
  }
  .gap { color: var(--danger); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* ---- 表单 ---- */
  textarea, input, select {
    font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  textarea { min-height: 104px; resize: vertical; }
  textarea:focus, input:focus, select:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
  }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .grid { display: grid; gap: 12px; }
  .grid.c2 { grid-template-columns: 1fr 1fr; }
  .grid.c3 { grid-template-columns: 2fr 1fr 1fr; }
  @media (max-width: 720px) { .grid.c2, .grid.c3 { grid-template-columns: 1fr; } }

  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .row.right { justify-content: flex-end; }
  button.btn {
    font: inherit; cursor: pointer; padding: 8px 15px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  button.btn:hover:not(:disabled) { background: var(--surface-2); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
  button.btn.quiet { border-color: transparent; color: var(--muted); }
  button.btn.danger { color: var(--danger); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  .spacer { flex: 1; }

  /* ---- 全局错误 / 提示 ---- */
  .err, .ok-msg {
    padding: 11px 14px; border-radius: var(--radius);
    margin-bottom: 14px; font-size: 13.5px;
  }
  .err { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }
  .ok-msg { background: var(--surface); color: var(--ok); border: 1px solid var(--ok); }
  .err:empty, .ok-msg:empty { display: none; }

  /* ---- 关键词标签 ---- */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    padding: 4px 6px 4px 11px; border-radius: 999px; font-size: 13px;
  }
  .tag button {
    border: 0; background: transparent; color: inherit; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 3px; opacity: .65;
  }
  .tag button:hover { opacity: 1; }

  /* ---- 运行日志 ---- */
  .log {
    background: #0e1116; color: #cdd6e3;
    border-radius: 8px; padding: 12px 14px;
    max-height: 340px; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .log:empty::after { content: "还没有输出"; color: #5b6676; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .pill.running { background: var(--accent-soft); color: var(--accent); }
  .pill.done { background: var(--surface-2); color: var(--ok); }
  .pill.failed { background: var(--danger-soft); color: var(--danger); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  .floating {
    position: fixed; right: 20px; bottom: 20px; z-index: 20;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(16, 24, 40, .16);
    border-radius: 999px; padding: 9px 15px;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }

  /* ---- 卡片编辑器 ---- */
  .dist { display: flex; height: 9px; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .dist i { display: block; }
  .dist .s { background: var(--accent); }
  .dist .m { background: #8fa4f0; }
  .dist .w { background: var(--border); }
  .cap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
  }
  .cap > summary {
    padding: 11px 14px; cursor: pointer; display: flex;
    align-items: center; gap: 10px; list-style: none;
  }
  .cap > summary::-webkit-details-marker { display: none; }
  .cap > summary:hover { background: var(--surface-2); }
  .cap .body { padding: 4px 14px 14px; border-top: 1px solid var(--border); }
  .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .badge.强 { background: var(--accent); border-color: var(--accent); color: #fff; }
  .badge.中 { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
</style>

<div class="shell">
  <aside>
    <div class="brand">jobstar <small>本地面板</small></div>
    <nav>
      <button data-view="queue" class="on">待确认队列<span class="tally" id="t-queue" hidden></span></button>
      <button data-view="collect">采集与打分</button>
      <button data-view="cards">能力卡片</button>
      <button data-view="label">标注</button>
      <button data-view="threshold">阈值</button>
      <button data-view="settings">设置</button>
    </nav>
    <div class="side-foot">
      发送仍然只能从命令行执行：<br><code>uv run jobstar send</code>
    </div>
  </aside>

  <main>
    <div class="bar" id="bar"></div>
    <div class="err" id="err"></div>
    <div class="ok-msg" id="ok"></div>
    <div id="main"></div>
  </main>
</div>
<div id="float"></div>

<script>
const $ = (s) => document.querySelector(s);
// 每个请求都带上 X-Jobstar-Panel 头：这是唯一能让浏览器对携带自定义头的
// 跨源 fetch 强制先走 CORS 预检的办法，而这个服务器不满足预检条件——跨站
// 的恶意页面发不出携带这个头的请求，写在这一处就不会有调用点漏掉（见
// panel/app.py 的 require_panel_request）。
const api = (p, o) => fetch(p, { ...o, headers: { ...(o && o.headers), "X-Jobstar-Panel": "1" } })
  .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
const send = (p, method, body) => api(p, {
  method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
});
// Important 1：原来的正则不转义单引号，但设置视图把 esc() 的结果塞进单
// 引号属性（value='${...}'）。last_collect_error 来自 CollectError 消息里
// 的 `{data[:300]!r}`——Python 的 repr() 恒用单引号包裹，所以第一次 JSON
// 解析失败的采集错误就能天然带出一个未转义的单引号，闭合掉属性、在设置
// 页开一个事件处理器——攻击面已经在系统自己产出的错误文案里，不需要
// 外部输入。tests/test_panel_html.py 逐个调用点盯着这件事。
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Important 6：面板是 §7"不静默失败"唯一的人工入口，却是最容易悄悄吞掉
// 后端错误的地方——api() 对任何非 2xx 都 reject，调用点一旦没接住，浏览器
// 只会在 devtools 里留一条没人看的 unhandled rejection，页面本身什么都不
// 显示。这里放一个跨视图共用的错误横幅：render() 统一 try/catch 兜住所有
// 视图 + bar() 自身的失败；不经过 render() 的独立操作各自再包一层。
function showError(err) {
  const msg = (err && typeof err === "object" && "detail" in err)
    ? err.detail
    : (err && err.message) || String(err);
  $("#err").innerHTML = `⚠️ ${esc(msg)}`;
  $("#ok").innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showOk(msg) { $("#ok").innerHTML = `✓ ${esc(msg)}`; $("#err").innerHTML = ""; }
function clearError() { $("#err").innerHTML = ""; $("#ok").innerHTML = ""; }
// url 来自采集器抓取的 <a href>（见 collector/boss.py），不是本系统自己
// 生成的值——esc() 只挡得住 HTML 转义，挡不住 javascript: 这类协议。这里
// 只放行 http(s) 链接，否则渲染成 "#"，防止一个被抓到的恶意 href 在人工
// 点「原页面」时于面板的源上执行脚本。
const safeHref = (u) => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
let view = "queue";

/* ==================== 顶部状态条 ==================== */

async function bar() {
  const h = await api("/api/health");
  const thr = h.score_threshold === null ? "未设" : h.score_threshold;
  const thrHint = h.score_threshold === null ? "冷启动期，不生成动作" : "达到即入队";
  // 每项的第二个元素是**已经转义好**的 HTML 片段（数字要配 <small> 副标），
  // 所以变量名按本文件的约定以 Html 结尾——tests/test_panel_html.py 的扫描器
  // 靠这个约定区分「待转义的数据」和「拼好的片段」。
  const stats = [
    ["今日已发", `${esc(h.sent_today)}<small> / ${esc(h.daily_limit)}</small>`, `剩余 ${esc(h.remaining_quota)}，${esc(h.quota_resets_at)} 重置`],
    ["待确认", esc(h.pending), "等你在队列页逐条过目"],
    ["入队阈值", esc(thr), thrHint],
  ];
  let html = `<div class="stats">` + stats.map(([k, valueHtml, hint]) => `
      <div class="stat" title="${esc(hint)}">
        <span class="k">${esc(k)}</span><span class="v">${valueHtml}</span>
      </div>`).join("") + `</div>`;

  const notes = [];
  // Important 4：这两条以前只说「待人工处理」，但产品里没有任何入口——
  // 打分失败的岗位在 run_score 眼里是吸收态（scores 行一旦存在就永远选不
  // 中它），人工看着数字却无处可点。现在指向「采集与打分」页的重跑开关。
  if (h.scoring_failed)
    notes.push(["warn", `打分失败 ${esc(h.scoring_failed)} 条 —— 去「采集与打分」勾上「重跑吸收态」再打一次分`]);
  // Minor 3：话术生成失败——分数是真的、只是没能写出话术——单独一条计数，
  // 不和上面"打分失败"混在一起（那会让人误以为分数本身不可信）。
  if (h.pitch_failed)
    notes.push(["warn", `话术生成失败 ${esc(h.pitch_failed)} 条（分数是有效的）—— 同样用「重跑吸收态」`]);
  if (h.uncertain)
    notes.push(["bad", `发送结果不确定 ${esc(h.uncertain)} 条 —— 消息可能已经发出，请到 Boss 对话列表人工核实`]);
  // Minor 5：另一种 sending——认领之后、真正发送之前被打断，error 是空的。
  // 和"发送结果不确定"分开措辞，因为它连发送按钮点没点到都不确定。
  if (h.interrupted)
    notes.push(["bad", `发送疑似中断 ${esc(h.interrupted)} 条 —— 连是否点过发送都不确定，请人工核实`]);

  // 采集健康状态：被动信号，只反映上一次真的跑过 collect 时观察到的结果，
  // 不是主动实时探活，所以措辞里如实带出「上次采集」。
  // last_collect_at 是「最近一次尝试」，成功失败都前进；last_collect_ok_at
  // 只在真正成功时前进。人工点掉错误横幅只清 last_collect_error——如果这里
  // 只看它是否为空就说「未见异常」，会把刚被点掉的那次失败说成是干净的。
  if (h.last_collect_error) {
    notes.push(["bad", `采集异常（截至上次采集，被动信号）：${esc(h.last_collect_error)}`, true]);
  } else if (h.last_collect_at && h.last_collect_at === h.last_collect_ok_at) {
    notes.push(["", `上次采集 ${esc(h.last_collect_at)}，未见异常`]);
  } else if (h.last_collect_at && h.last_collect_ok_at) {
    notes.push(["warn", `上次尝试采集 ${esc(h.last_collect_at)}，最近一次成功是 ${esc(h.last_collect_ok_at)}`]);
  } else if (h.last_collect_at) {
    notes.push(["warn", `上次尝试采集 ${esc(h.last_collect_at)}，尚无成功记录`]);
  }

  if (notes.length) {
    // textHtml 同上：notes 里塞进来的每一条都已经在 push 的地方 esc() 过了
    html += `<div class="notes">` + notes.map(([cls, textHtml, clearable]) =>
      `<div class="note ${esc(cls)}">${textHtml}${clearable ? `<button class="btn quiet" id="clear-err">知道了</button>` : ""}</div>`
    ).join("") + `</div>`;
  }
  $("#bar").innerHTML = html;

  const tally = $("#t-queue");
  tally.hidden = !h.pending;
  tally.textContent = h.pending;

  const btn = $("#clear-err");
  if (btn) btn.onclick = async () => {
    try { await api("/api/health/clear-error", { method: "POST" }); await bar(); }
    catch (err) { showError(err); }
  };
}

/* ==================== 待确认队列 ==================== */

// Minor 5：两种 sending 都渲染成一张只读卡片 + 一对 resolve 按钮——人工去
// Boss 对话列表核实过之后点哪个都行，两个按钮背后都只是记账（sending →
// sent / sending → failed），不会真的发消息。noteHtml 是两种变体唯一的
// 措辞区别：uncertain 有 error（发送按钮点了、读回确认失败），interrupted
// 没有（进程在认领之后、真正发送之前被打断，连点没点到都不确定）。
function _sendingCard(row, noteHtml) {
  return `
      <div class="card flag" data-resolve-id="${esc(row.action_id)}">
        <div class="card-head"><div class="title">
          <b>${esc(row.title)}</b> · ${esc(row.company)}
          <div class="meta"><a href="${safeHref(row.url)}" target="_blank" rel="noopener">原页面</a></div>
        </div></div>
        ${noteHtml}
        <div class="row">
          <button class="btn" data-resolve="sent">已确认送达</button>
          <button class="btn" data-resolve="failed">已确认未送达</button>
        </div>
      </div>`;
}

async function renderQueue() {
  const { items, uncertain, interrupted } = await api("/api/queue");
  let html = `<h2>待确认队列</h2>
    <p class="lede">每一条都要你亲自过目。改完话术再点确认，发出去的就是框里这段文字。</p>`;
  if (uncertain.length) {
    html += `<h3>发送结果不确定 —— 请到 Boss 对话列表核实</h3>` +
      uncertain.map(u => _sendingCard(u, `<div class="meta gap" style="margin-top:8px">${esc(u.error)}</div>`)).join("");
  }
  if (interrupted.length) {
    html += `<h3>发送疑似中断 —— 连是否点过发送都不确定</h3>` +
      interrupted.map(u => _sendingCard(u, "")).join("");
  }
  if (!items.length) {
    html += `<div class="empty">队列为空。<br>去「采集与打分」跑一轮，或者先在「阈值」页定一个入队阈值。</div>`;
  } else {
    html += (uncertain.length || interrupted.length) ? `<h3>等待确认</h3>` : "";
    html += items.map(i => `
      <div class="card" data-id="${esc(i.action_id)}">
        <div class="card-head">
          <div class="title">
            <b>${esc(i.title)}</b> · ${esc(i.company)}

const SUMMARY_LABELS = {
  listed: "列表条数", new: "新增", gated_out: "门禁刷掉", detail_fetched: "抓取详情",
  scored: "已打分", failed: "打分失败", pitch_failed: "话术失败",
  enqueued: "新入队", already_queued: "队列里已有", retracted: "撤回过期招呼",
};

/* 轮询后台任务状态。只在「运行中」时继续排下一次——任务结束后停表，
   避免面板长期空转。切换视图时 render() 会把定时器清掉。 */
async function pollRun() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  let task;
  try {
    ({ task } = await api("/api/run/status"));
  } catch (err) { return showError(err); }

  drawFloating(task);
  const log = $("#run-log");
  if (log && task) {
    const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.innerHTML = task.lines.map(l => `${esc(l)}\n`).join("");
    if (pinned) log.scrollTop = log.scrollHeight;

    const label = { running: "运行中", done: "已完成", failed: "失败" }[task.status] || task.status;
    $("#run-pill").innerHTML =
      `<span class="pill ${esc(task.status)}">${task.status === "running" ? `<i class="dot"></i>` : ""}${esc(label)} · ${esc(task.label)}</span>`;

    // 只显示非零的计数。一整行「已打分 0 · 门禁刷掉 0 · 打分失败 0 …」
    // 读起来全是噪音，真正有信息的那几个数字反而被埋掉了。
    const parts = [];
    if (task.summary) {
      for (const [k, v] of Object.entries(task.summary)) {
        if (k === "errors" || !v || !SUMMARY_LABELS[k]) continue;
        parts.push(`${esc(SUMMARY_LABELS[k])} ${esc(v)}`);
      }
      if (!parts.length && task.status === "done") parts.push("这一轮没有需要处理的岗位");
    }
    const errs = (task.summary && task.summary.errors) || [];
    if (errs.length) parts.push(`<span class="gap">${esc(errs.length)} 条出错，详见上面的日志</span>`);
    if (task.error) parts.push(`<span class="gap">${esc(task.error)}</span>`);
    $("#run-summary").innerHTML = parts.join("　·　");
  }

  if (task && task.status === "running") {
    pollTimer = setTimeout(pollRun, 1500);
  } else if (task && log) {
    await bar();   // 跑完了，顶部计数要跟上
  }
}

function drawFloating(task) {
  const box = $("#float");
  if (!task || task.status !== "running" || view === "collect") { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="floating" id="go-run">
      <span class="pill running"><i class="dot"></i>${esc(task.label)} 运行中</span>
      <span class="meta">查看</span></div>`;
  $("#go-run").onclick = () => switchTo("collect");
}

const STRENGTHS = ["强", "中", "弱"];
const STRENGTH_HINT = { "强": "能讲 30 分钟", "中": "能讲 5 分钟", "弱": "仅接触" };

      <div class="meta" style="margin-top:10px">

  html += cardsData.map((c, i) => `
    <details class="cap" data-card="${esc(i)}">

        <span class="badge ${esc(c.strength)}">${esc(c.strength)}</span>

            ).join("")}</select></label>
        </div>

/* 把 DOM 里的编辑结果读回 cardsData。不在每次输入时同步状态，是为了避免
   重渲染打断正在输入的输入框（焦点和光标位置都会丢）。 */
function harvestCards() {
  for (const box of document.querySelectorAll("[data-card]")) {
    const c = cardsData[Number(box.dataset.card)];
    if (!c) continue;
    for (const el of box.querySelectorAll("[data-f]")) {
      const f = el.dataset.f;
      c[f] = ["synonyms", "metrics", "resume_versions"].includes(f)
        ? el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)
        : el.value;
    }
  }
}

/* ==================== 路由 ==================== */

const VIEWS = {
  queue: renderQueue, collect: renderCollect, cards: renderCards,
  label: renderLabel, threshold: renderThreshold, settings: renderSettings,
};

async function render() {
  // Important 6：所有视图和 bar() 都在这里统一 await——任何一个的 api()
  // 调用失败，都会顺着这条 await 链条冒泡到这里被兜住，而不是变成一条
  // 没人看的 unhandled rejection、把页面晾在半渲染的状态。
  clearError();
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  try {
    await bar();
    await VIEWS[view]();
    if (view !== "collect") await pollRun();   // 别的视图上也要能看到「正在跑」
  } catch (err) {
    showError(err);
  }
}

function switchTo(next) {
  view = next;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === next));
  return render();
}

document.addEventListener("click", async (e) => {
  const navBtn = e.target.closest("nav button");
  if (navBtn) return switchTo(navBtn.dataset.view);

  const act = e.target.dataset.act;
  if (act) {
    const card = e.target.closest(".card");
    const id = card.dataset.id;
    const greeting = card.querySelector("textarea").value;
    try {
      await send(`/api/actions/${id}/${act}`, "POST", act === "approve" ? { greeting } : {});
    } catch (err) {
      // showError 必须排在 render() 之后：render() 开头就 clearError()，
      // 先报错再重渲染的话，刚写上去的错误横幅会在同一帧里被抹掉——人工
      // 看到的是「点了确认，什么都没发生」。而这里的两条错误恰恰是最不能
      // 丢的：话术为空被拒（否则人工以为按库里原稿发出去了），以及 409
      // 状态冲突（这一行在别处已经被跳过/认领）。先 render 让队列反映真实
      // 状态，再把解释写上去。
      await render();
      return showError(err);
    }
    return render();
  }

  // Minor 5：resolve 按钮——人工去 Boss 对话列表核实过一条 sending 行之后，
  // 点这里记录看到的结果。两个按钮都只是记账（sending → sent / sending →
  // failed），不会打开浏览器、不会真的发消息。
  const resolve = e.target.dataset.resolve;
  if (resolve) {
    const card = e.target.closest("[data-resolve-id]");
    const id = card.dataset.resolveId;
    try {
      await send(`/api/actions/${id}/resolve`, "POST", { outcome: resolve });
    } catch (err) {
      await render();  // 同上：render() 会 clearError()，报错必须排在它之后
      return showError(err);
    }
    return render();
  }

  const detail = e.target.dataset.detail;
  if (detail) {
    e.preventDefault();
    const box = e.target.closest(".card").querySelector(".detail");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    try {
      const d = await api(`/api/jobs/${detail}`);
      box.innerHTML = `<div class="jd" style="white-space:normal">` + d.dimensions.map(dim => `
        <div style="margin-bottom:10px">
          <b>${esc(dim.label)}：${esc(dim.score)}</b><br>
          <span class="meta">${esc(dim.reason)}</span><br>
          ${dim.cards.map(c => `<span class="meta">[${esc(c.id)}] ${esc(c.capability)}（证据${esc(c.strength)}）· ${esc(c.project)}</span><br>`).join("")}
          <span class="meta gap">缺口：${esc(dim.gap)}</span>
        </div>`).join("") + `</div>`;
    } catch (err) {
      showError(err);
    }
    return;
  }

  const yes = e.target.hasAttribute("data-label-yes");
  const no = e.target.hasAttribute("data-label-no");
  if (yes || no) return label(yes);
});

async function label(wouldApply) {
  const card = document.querySelector("[data-label]");
  if (!card) return;
  try {
    await send("/api/label", "POST", { job_id: card.dataset.label, would_apply: wouldApply });
  } catch (err) {
    showError(err);
    return;
  }
  render();
}

document.addEventListener("keydown", (e) => {
  if (view !== "label" || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "y") label(true);
  if (e.key === "n") label(false);
});

render();
</script>
